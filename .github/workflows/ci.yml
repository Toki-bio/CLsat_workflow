name: ci
on: [push, pull_request]
jobs:
  unit:
    # no external tools: stage-script pytest and the bash driver tests (schema, check, config, anchor, subx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: sudo apt-get install -y gawk jq && pip install pytest
      - run: bash tests/run_all.sh
      - run: bin/satpipe check configs/darevskia_clsat.yaml --no-files --no-tools
      - run: bin/satpipe check configs/example_minimal.yaml --no-files --no-tools
  toy:
    # end to end on synthetic genomes with the real tools (conda); the equivalence harness
    # against the original scripts, then the driver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: conda-incubator/setup-miniconda@v3
        with: {environment-file: environment.yml, activate-environment: satpipe, auto-activate-base: false}
      - shell: bash -el {0}
        run: |
          export PATH=$PWD/bin:$PATH
          ln -sf "$(command -v gawk)" "$CONDA_PREFIX/bin/awk"
          # both scripts must build the toy project with the same seed (default 7)
          bash tests/toy/run_toy_equivalence.sh . /tmp/toy_eq 4d70b56
          bash tests/toy/run_driver_toy.sh . /tmp/toy_drv /tmp/toy_eq
