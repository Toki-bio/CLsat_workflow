# conda environment with every external tool satpipe calls (versions of the published run where
# the channel still has them; newer builds are fine, ssearch36 bit scores vary between runs anyway).
#   conda env create -f environment.yml && conda activate satpipe && pip install -e .
name: satpipe
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.10
  - pyyaml
  - pytest
  - trf>=4.09
  - vsearch>=2.22
  - mafft>=7.5
  - fasta3            # ssearch36
  - emboss            # cons, needle, water
  - blast>=2.12       # blastn, makeblastdb (stage 07 only)
  - samtools>=1.12
  - bedtools>=2.30
  - parallel
  - gawk
  - bc
