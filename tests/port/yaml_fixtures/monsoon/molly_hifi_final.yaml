# families / family_assignment are PLACEHOLDERS (required by the config, not used before stage 09).
run_name: molly_hifi_final
out_dir: /scratch/sk4386/molly_final/run
genomes:
  lat:  /scratch/sk4386/molly_asm/asm_full/lat/lat.p_ctg.fa
  mex:  /scratch/sk4386/molly_asm/asm_full/mex/mex.p_ctg.fa
  Flat: /scratch/sk4386/molly_asm/asm_full/formosa_trio/formosa.hap1.fa
  Fmex: /scratch/sk4386/molly_asm/asm_full/formosa_trio/formosa.hap2.fa
families:
  Placeholder: {consensus: /scratch/sk4386/satpipe_final/repo/satpipe/stages/02_seed_expansion_scan/consensus/CLsat1.cons.fa, mono: 146}
family_assignment: /scratch/sk4386/molly_final/cluster_family_placeholder.tsv
expansion: {jobs: 32}
finalisation:
  large_scaffold_bp: 80000000
  trf_timeout: 600
discovery: {strand: both, monomerize: true}
