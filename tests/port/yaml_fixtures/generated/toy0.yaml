run_name: toy
out_dir: /w/toy work/run
genomes:
  spa: /data/toy/genomes/spa.fna
  spb: /data/toy/genomes/spb.fna
families:
  CLsat1: {consensus: /repo/satpipe/satpipe/stages/02_seed_expansion_scan/consensus/CLsat1.cons.fa, mono: 146}
  CLsat2: {consensus: /repo/satpipe/satpipe/stages/02_seed_expansion_scan/consensus/CLsat2.cons.fa, mono: 145}
  CLsat3: {consensus: /repo/satpipe/satpipe/stages/02_seed_expansion_scan/consensus/CLsat3.cons.fa, mono: 146}
  CLsat4: {consensus: /repo/satpipe/satpipe/stages/02_seed_expansion_scan/consensus/CLsat4.cons.fa, mono: 116}
references: {rotated_consensus: /data/toy/refs.rot}
